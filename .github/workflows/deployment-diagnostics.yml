name: Deployment diagnostics

on:
  push:
    branches: [main]
    paths: [.github/workflows/deployment-diagnostics.yml]

permissions:
  contents: read

jobs:
  swarm-state:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Swarm scheduling state
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          command_timeout: 1m
          script: |
            set -eu
            docker info --format 'LocalNode={{.Swarm.NodeID}} State={{.Swarm.LocalNodeState}} Manager={{.Swarm.ControlAvailable}}'
            docker node ls --format 'Node={{.ID}} State={{.Status}} Availability={{.Availability}} Manager={{.ManagerStatus}}'
