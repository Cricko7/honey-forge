name: CI and Docker deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start TLS infrastructure
        env:
          POSTGRES_PASSWORD: test
          REDIS_PASSWORD: 0123456789abcdef0123456789abcdef
        run: |
          sh ./gen-certs.sh
          docker compose up -d --wait --wait-timeout 180
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - name: Backend format, vet and build
        working-directory: src/backend
        run: |
          test -z "$(gofmt -l .)"
          go mod download
          go vet ./...
          go build ./...
      - name: Backend unit tests
        working-directory: src/backend
        run: go test -race ./... -count=1
      - name: PostgreSQL, Kafka and Redis TLS integration tests
        working-directory: src/backend
        env:
          TEST_DATABASE_URL: postgres://honey_forge:test@127.0.0.1:5432/honey_forge?sslmode=verify-full&sslrootcert=${{ github.workspace }}/certs/ca.crt
          TEST_KAFKA_BROKERS: 127.0.0.1:29092
          TEST_KAFKA_CA_FILE: ${{ github.workspace }}/certs/ca.crt
          TEST_REDIS_URL: rediss://:0123456789abcdef0123456789abcdef@127.0.0.1:6379/0
          TEST_REDIS_CA_FILE: ${{ github.workspace }}/certs/ca.crt
          TEST_NGINX_PROXY: "1"
        run: go test -race -tags=integration ./... -count=1
      - name: Optional SSH sandbox acceptance
        if: vars.ENABLE_SSH_ACCEPTANCE == 'true'
        env:
          TEST_SSH_DOCKER: "1"
          SSH_SANDBOX_IMAGE: honeyforge/ssh-sandbox:test
        run: |
          docker build -f deploy/decoys/Dockerfile.sandbox -t "$SSH_SANDBOX_IMAGE" .
          cd src/backend
          go test -race -tags=integration ./internal/decoys/sshtrap -run TestDockerRealLinuxShellSFTPAndIsolation -count=1 -timeout=120s
      - name: MASK-3 worker isolation acceptance
        env:
          TEST_MASK3_DOCKER: "1"
          DECOY_TCP_IMAGE: honeyforge/tcp-decoy:test
        run: |
          docker build -f deploy/decoys/Dockerfile --target tcp -t "$DECOY_TCP_IMAGE" .
          cd src/backend
          go test -race -tags=integration ./internal/agent -run TestDockerWorkerMASK3Isolation -count=1 -timeout=120s
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Stop test infrastructure
        if: always()
        env:
          POSTGRES_PASSWORD: test
        run: docker compose down

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PUBLIC_ORIGIN: ${{ vars.API_BASE_URL || 'https://honey-forge-seg-fault.ru' }}
      TELEMETRY_ORIGIN: ${{ vars.TELEMETRY_ORIGIN || 'https://resources.honey-forge-seg-fault.ru' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          for key in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
          done
          [[ "$PUBLIC_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || {
            echo '::error::API_BASE_URL must be an HTTPS origin without a path'
            exit 1
          }

      - name: Validate telemetry origin
        run: |
          [[ "$TELEMETRY_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || {
            echo '::error::TELEMETRY_ORIGIN must be a separate HTTPS resource origin'
            exit 1
          }
          public_host=${PUBLIC_ORIGIN#https://}; public_host=${public_host%%:*}
          resource_host=${TELEMETRY_ORIGIN#https://}; resource_host=${resource_host%%:*}
          test "${public_host,,}" != "${resource_host,,}" || {
            echo '::error::Telemetry and operator API must use different hosts'
            exit 1
          }

      # Опционально: диагностика. Удалите после первого успешного деплоя.
      - name: Debug fingerprint (optional)
        env:
          FP: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          echo "Fingerprint length: ${#FP}"
          echo "First 20 chars: ${FP:0:20}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend with real API
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ env.PUBLIC_ORIGIN }}
        run: |
          npm ci
          npm run build

      - name: Build and package versioned Docker images
        env:
          ENABLE_SSH: ${{ vars.ENABLE_SSH_ACCEPTANCE }}
        run: |
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p release
          images=("honeyforge/api:$tag" "honeyforge/orchestrator:$tag")
          docker build -f Dockerfile.api -t "${images[0]}" .
          docker build -f deploy/decoys/Dockerfile.orchestrator -t "${images[1]}" .
          printf 'API_IMAGE=%s\nORCHESTRATOR_IMAGE=%s\n' "${images[0]}" "${images[1]}" > release/release.env
          for entry in 'tcp:tcp-decoy:DECOY_TCP_IMAGE' 'redis:redis-decoy:DECOY_REDIS_IMAGE' 'honeytokens:honeytoken-decoy:DECOY_HONEYTOKEN_IMAGE'; do
            IFS=: read -r target image key <<< "$entry"
            docker build -f deploy/decoys/Dockerfile --target "$target" -t "honeyforge/$image:$tag" .
            images+=("honeyforge/$image:$tag")
            printf '%s=%s\n' "$key" "honeyforge/$image:$tag" >> release/release.env
          done
          if [ "$ENABLE_SSH" = true ]; then
            docker build -f deploy/decoys/Dockerfile --target ssh -t "honeyforge/ssh-decoy:$tag" .
            docker build -f deploy/decoys/Dockerfile.sandbox -t "honeyforge/ssh-sandbox:$tag" .
            images+=("honeyforge/ssh-decoy:$tag" "honeyforge/ssh-sandbox:$tag")
            printf 'DECOY_SSH_IMAGE=honeyforge/ssh-decoy:%s\nSSH_SANDBOX_IMAGE=honeyforge/ssh-sandbox:%s\n' "$tag" "$tag" >> release/release.env
          fi
          docker save "${images[@]}" | gzip > release/images.tar.gz
          cp -R frontend/dist release/frontend

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # fingerprint убран: Go SSH-клиент внутри scp-action
          # может договариваться на другой host key, чем указанный
          # в секрете. Аутентификация по приватному ключу остаётся.
          port: ${{ vars.SSH_PORT || 22 }}
          source: release/
          strip_components: 1
          target: /opt/honeyforge/incoming/${{ github.run_id }}-${{ github.run_attempt }}/
          timeout: 60s
          command_timeout: 20m

      - name: Install Docker release and retire systemd API
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_ORIGIN: ${{ env.PUBLIC_ORIGIN }}
          EXPECTED_TELEMETRY_ORIGIN: ${{ env.TELEMETRY_ORIGIN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # fingerprint убран по той же причине
          port: ${{ vars.SSH_PORT || 22 }}
          envs: RELEASE_ID,EXPECTED_ORIGIN,EXPECTED_TELEMETRY_ORIGIN
          command_timeout: 20m
          script: |
            set -eu
            ROOT=/opt/honeyforge
            INCOMING="$ROOT/incoming/$RELEASE_ID"
            MANIFEST="$ROOT/compose.production.yml"
            CONFIG=/etc/honey-forge/production.env
            FRONT=/var/www/honeyforge-frontend
            test -f "$MANIFEST"
            test -f "$CONFIG"
            if grep -q 'REPLACE_WITH_' "$CONFIG"; then echo 'Configure production.env first'; exit 1; fi
            test -f "$INCOMING/release.env"
            test -f "$INCOMING/images.tar.gz"
            test -f "$INCOMING/frontend/index.html"
            test -L "$FRONT" || { echo 'Prepare the frontend symlink before first deployment'; exit 1; }
            test -r /etc/honey-forge/certs/backend-ca.crt
            test -r /etc/honey-forge/certs/backend.crt
            test -r /etc/honey-forge/certs/backend.key
            test -r /etc/honey-forge/certs/public-ca.crt
            openssl verify -CAfile /etc/honey-forge/certs/backend-ca.crt -verify_hostname api /etc/honey-forge/certs/backend.crt
            openssl verify -CAfile /etc/honey-forge/certs/backend-ca.crt -verify_hostname localhost /etc/honey-forge/certs/backend.crt
            docker info >/dev/null
            docker compose version
            compose() {
              docker compose --project-name honeyforge --env-file "$CONFIG" --env-file "$1" -f "$MANIFEST" "${@:2}"
            }
            test -n "${BASH_VERSION:-}" || { echo 'SSH login shell must be bash'; exit 1; }
            compose "$INCOMING/release.env" config --quiet
            grep -Fx "PUBLIC_ORIGIN=$EXPECTED_ORIGIN" "$CONFIG" >/dev/null || {
              echo 'PUBLIC_ORIGIN on the server must match API_BASE_URL'; exit 1;
            }
            grep -Fx "API_PUBLIC_ORIGIN=$EXPECTED_ORIGIN" "$CONFIG" >/dev/null || {
              echo 'Set API_PUBLIC_ORIGIN in production.env and pass it to the API container'; exit 1;
            }
            expected_agent_url="wss://${EXPECTED_TELEMETRY_ORIGIN#https://}/assets/stream"
            grep -Fx "AGENT_WS_URL=$expected_agent_url" "$CONFIG" >/dev/null || {
              echo 'AGENT_WS_URL must point to TELEMETRY_ORIGIN in production.env and both API/orchestrator containers'; exit 1;
            }
            for key in POSTGRES_VOLUME KAFKA_VOLUME REDIS_VOLUME; do
              volume=$(sed -n "s/^$key=//p" "$CONFIG")
              case "$volume" in ''|*[!a-zA-Z0-9_.-]*) echo "Invalid $key"; exit 1;; esac
              docker volume inspect "$volume" >/dev/null
              for container in $(docker ps --filter "volume=$volume" --format '{{.ID}}'); do
                project=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container")
                test "$project" = honeyforge || {
                  echo "Volume $volume is used by another deployment; prepare the data cutover first"; exit 1;
                }
              done
            done
            if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ]; then
              test "$(docker node ls --format '{{.ID}}' | wc -l)" -eq 1 || {
                echo 'This workflow supports one Swarm node. Multiple nodes require a registry.'; exit 1;
              }
            fi
            gzip -dc "$INCOMING/images.tar.gz" | docker load
            PREVIOUS_ENV=''
            if [ -f "$ROOT/current/release.env" ]; then PREVIOUS_ENV=$(readlink -f "$ROOT/current/release.env"); fi
            PREVIOUS_FRONT=$(readlink -f "$FRONT")
            OLD_SYSTEMD=0
            if sudo -n systemctl is-active --quiet honeyforge; then OLD_SYSTEMD=1; fi
            rollback() {
              trap - EXIT
              echo 'Deployment failed; attempting application rollback (database migrations are not reverted)'
              compose "$INCOMING/release.env" logs --tail=100 api orchestrator || true
              if [ -n "$PREVIOUS_ENV" ]; then
                compose "$PREVIOUS_ENV" up -d --no-build --pull never api orchestrator || true
              elif [ "$OLD_SYSTEMD" -eq 1 ]; then
                compose "$INCOMING/release.env" stop api orchestrator || true
                sudo -n systemctl start honeyforge || true
              fi
              ln -s "$PREVIOUS_FRONT" "$FRONT.rollback"
              mv -Tf "$FRONT.rollback" "$FRONT"
              exit 1
            }
            trap rollback EXIT
            compose "$INCOMING/release.env" up -d --wait --wait-timeout 180 postgres kafka redis
            if [ "$OLD_SYSTEMD" -eq 1 ]; then sudo -n systemctl stop honeyforge; fi
            compose "$INCOMING/release.env" up -d --no-build --pull never api
            healthy=0
            for i in $(seq 1 60); do
              if curl --fail --silent --max-time 5 --cacert /etc/honey-forge/certs/backend-ca.crt https://localhost:8443/healthz | grep -q '"status":"ok"'; then
                healthy=1; break
              fi
              sleep 2
            done
            test "$healthy" -eq 1
            compose "$INCOMING/release.env" up -d --no-build --pull never orchestrator
            ready=0
            for i in $(seq 1 60); do
              api_id=$(compose "$INCOMING/release.env" ps -q api)
              redis_id=$(compose "$INCOMING/release.env" ps -q redis)
              if [ -n "$api_id" ] && [ -n "$redis_id" ] && \
                 [ "$(docker inspect --format '{{if index .NetworkSettings.Networks "hf-mgmt"}}ready{{end}}' "$api_id")" = ready ] && \
                 [ "$(docker inspect --format '{{if index .NetworkSettings.Networks "hf-mgmt"}}ready{{end}}' "$redis_id")" = ready ] && \
                 [ -z "$(docker inspect --format '{{if index .NetworkSettings.Networks "hf-decoys"}}unsafe{{end}}' "$api_id")" ] && \
                 [ -z "$(docker inspect --format '{{if index .NetworkSettings.Networks "hf-decoys"}}unsafe{{end}}' "$redis_id")" ]; then
                ready=1; break
              fi
              sleep 2
            done
            test "$ready" -eq 1
            . "$INCOMING/release.env"
            for service in $(docker service ls --filter label=honeyforge.trap --format '{{.ID}}'); do
              old_image=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' "$service")
              case "$old_image" in
                honeyforge/tcp-decoy:*) image="$DECOY_TCP_IMAGE";;
                honeyforge/redis-decoy:*) image="$DECOY_REDIS_IMAGE";;
                honeyforge/honeytoken-decoy:*) image="$DECOY_HONEYTOKEN_IMAGE";;
                *) echo "Unchanged service $service: $old_image"; continue;;
              esac
              docker service update --detach=false --no-resolve-image --image "$image" --env-add "TRAP_WORKER_IMAGE=$image" --update-order stop-first --update-parallelism 1 --update-failure-action rollback "$service"
              state=$(docker service inspect --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' "$service")
              test "$state" = completed
            done
            chmod a+rx "$ROOT" "$ROOT/incoming" "$INCOMING"
            chmod -R a+rX "$INCOMING/frontend"
            ln -s "$INCOMING/frontend" "$FRONT.next"
            mv -Tf "$FRONT.next" "$FRONT"
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            operator_host=${EXPECTED_ORIGIN#https://}; operator_host=${operator_host%%:*}
            operator_ip=$(sed -n 's/^MGMT_BIND_IP=//p' "$CONFIG"); operator_ip=${operator_ip:-127.0.0.1}
            code=$(curl --silent --show-error --max-time 10 --cacert /etc/honey-forge/certs/public-ca.crt --resolve "$operator_host:443:$operator_ip" --output /dev/null --write-out '%{http_code}' "$EXPECTED_ORIGIN/api/session")
            test "$code" = 401
            ln -s "$INCOMING" "$ROOT/current.next"
            mv -Tf "$ROOT/current.next" "$ROOT/current"
            if [ "$OLD_SYSTEMD" -eq 1 ]; then sudo -n systemctl disable honeyforge; fi
            trap - EXIT
            echo 'Docker API, orchestrator, TCP/Redis agents and frontend updated'

      - name: Management API, WSS and frontend smoke tests over SSH
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_ORIGIN: ${{ env.PUBLIC_ORIGIN }}
          EXPECTED_TELEMETRY_ORIGIN: ${{ env.TELEMETRY_ORIGIN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          envs: EXPECTED_ORIGIN,EXPECTED_TELEMETRY_ORIGIN
          command_timeout: 5m
          script: |
            set -eu
            PUBLIC_ORIGIN=$EXPECTED_ORIGIN
            TELEMETRY_ORIGIN=$EXPECTED_TELEMETRY_ORIGIN
            API_HOST=$(sed -n 's/^MGMT_BIND_IP=//p' /etc/honey-forge/production.env)
            API_HOST=${API_HOST:-127.0.0.1}
            SMOKE_TMP=$(mktemp -d)
            trap 'rm -f "$SMOKE_TMP/resource.js" "$SMOKE_TMP/rejected.js"; rmdir "$SMOKE_TMP"' EXIT
            tls=(--cacert /etc/honey-forge/certs/public-ca.crt)
            DOMAIN=$(echo "$PUBLIC_ORIGIN" | sed -E 's|https?://||; s|/.*||')
            echo "Testing $PUBLIC_ORIGIN via $API_HOST"
            for entry in '/api/session:401' '/assets/stream:404' '/api/stream:401' '/:200' '/app/profiles:200'; do
              path="${entry%:*}"
              expected="${entry##*:}"
              code=$(curl "${tls[@]}" --silent --show-error --max-time 20 --retry 3 \
                --resolve "$DOMAIN:443:$API_HOST" \
                --output /dev/null --write-out '%{http_code}' "$PUBLIC_ORIGIN$path")
              echo "$path: $code"
              test "$code" = "$expected"
            done
            curl "${tls[@]}" --resolve "$DOMAIN:443:$API_HOST" --fail --silent --show-error --max-time 20 "$PUBLIC_ORIGIN/" | grep -q '<div id="root">'
            RESOURCE_AUTHORITY=${TELEMETRY_ORIGIN#https://}
            RESOURCE_HOST=${RESOURCE_AUTHORITY%%:*}
            RESOURCE_PORT=443
            if [[ "$RESOURCE_AUTHORITY" == *:* ]]; then RESOURCE_PORT=${RESOURCE_AUTHORITY##*:}; fi
            resolve=(--resolve "$RESOURCE_HOST:$RESOURCE_PORT:$API_HOST")
            for entry in '/:200' '/assets/stream:200' '/api/session:404' '/api/stream:404' '/app/profiles:404'; do
              path="${entry%:*}"; expected="${entry##*:}"
              code=$(curl "${tls[@]}" "${resolve[@]}" --silent --show-error --max-time 20 \
                --output /dev/null --write-out '%{http_code}' "$TELEMETRY_ORIGIN$path")
              echo "resource $path: $code"
              test "$code" = "$expected"
            done
            curl "${tls[@]}" "${resolve[@]}" --fail --silent --show-error --max-time 20 \
              "$TELEMETRY_ORIGIN/" | grep -q '<title>Resource Library</title>'
            curl "${tls[@]}" "${resolve[@]}" --fail --silent --show-error --max-time 20 \
              --output "$SMOKE_TMP/resource.js" "$TELEMETRY_ORIGIN/assets/stream"
            curl "${tls[@]}" "${resolve[@]}" --fail --silent --show-error --max-time 20 \
              -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Authorization: Bearer invalid-smoke-token' \
              --output "$SMOKE_TMP/rejected.js" "$TELEMETRY_ORIGIN/assets/stream"
            cmp "$SMOKE_TMP/resource.js" "$SMOKE_TMP/rejected.js"
            if grep -Eiq 'honeyforge|honeypot|agent_unauthenticated|Invalid agent credentials' "$SMOKE_TMP/resource.js"; then
              echo '::error::Resource response discloses the telemetry channel'; exit 1
            fi
