name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Проверки и тесты ─────────────────────────────────
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: honey_forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 5
      kafka:
        image: apache/kafka:4.1.2
        ports: ["29092:29092"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: src/backend/go.sum
      - name: gofmt
        working-directory: src/backend
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: src/backend
        run: go vet ./...
      - name: Unit tests
        working-directory: src/backend
        run: go test ./... -count=1
      - name: Integration + race
        working-directory: src/backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/honey_forge_test?sslmode=disable
          TEST_KAFKA_BROKERS: 127.0.0.1:29092
        run: go test -race -tags=integration ./... -count=1

  # ── 2. Деплой на сервер ─────────────────────────────────
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: src/backend/go.sum

      - name: Build static binary
        working-directory: src/backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o honey-forge-api ./cmd/api

      - name: Upload binary, migrations and nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src/backend/honey-forge-api,migrations/,deploy/nginx/honey-forge.conf"
          target: "/opt/honeyforge/"
          strip_components: 0
          overwrite: true

      - name: Restart API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo systemctl restart honeyforge
            # ждём готовности healthz
            for i in $(seq 1 15); do
              if curl --fail --silent \
                  --cacert /etc/nginx/certs/backend-ca.crt \
                  --resolve localhost:8443:127.0.0.1 \
                  https://localhost:8443/healthz | grep -q '"status":"ok"'; then
                echo "API is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "API failed to become healthy"
            journalctl -u honeyforge -n 100 --no-pager
            exit 1

      - name: Update nginx config (if changed)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo install -m 0644 /opt/honeyforge/deploy/nginx/honey-forge.conf \
                                /etc/nginx/conf.d/honey-forge.conf
            sudo nginx -t
            sudo systemctl reload nginx

      - name: External smoke test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # без cookie → 401
            code=$(curl -s -o /dev/null -w "%{http_code}" https://api.example.org/api/session)
            [ "$code" = "401" ] || (echo "expected 401, got $code"; exit 1)
            # /assets/stream без токена агента → 401
            code=$(curl -s -o /dev/null -w "%{http_code}" https://api.example.org/assets/stream)
            [ "$code" = "401" ] || (echo "expected 401, got $code"; exit 1)
            # / → 404
            code=$(curl -s -o /dev/null -w "%{http_code}" https://api.example.org/)
            [ "$code" = "404" ] || (echo "expected 404, got $code"; exit 1)
            echo "Smoke test passed"