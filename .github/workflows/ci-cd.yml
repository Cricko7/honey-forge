name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: honey_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:4.1.2
        ports:
          - 29092:29092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:29092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "nc -z localhost 29092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            src/backend/go.sum
            src/redis-trap/go.sum

      - name: Verify and build all modules
        run: |
          for module in src/backend src/redis-trap; do
            if [ ! -d "$module" ]; then
              echo "::warning::Directory $module not found, skipping"
              continue
            fi
            echo "::group::Processing $module"
            (cd "$module" && go mod download && go vet ./... && go build ./...)
            echo "::endgroup::"
          done

      - name: Unit tests
        run: |
          for module in src/backend src/redis-trap; do
            if [ ! -d "$module" ]; then
              echo "::warning::Directory $module not found, skipping"
              continue
            fi
            echo "::group::Unit tests $module"
            (cd "$module" && go test ./... -count=1)
            echo "::endgroup::"
          done

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/honey_forge_test?sslmode=disable
          TEST_KAFKA_BROKERS: 127.0.0.1:29092
        run: |
          for module in src/backend src/redis-trap; do
            if [ ! -d "$module" ]; then
              echo "::warning::Directory $module not found, skipping"
              continue
            fi
            echo "::group::Integration tests $module"
            (cd "$module" && go test -race -tags=integration ./... -count=1)
            echo "::endgroup::"
          done

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: src/backend/go.sum

      - name: Build Linux amd64 binary
        working-directory: src/backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -buildvcs=false -o honey-forge-api ./cmd/api

      - name: Upload binary, migrations and deploy configs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          source: "src/backend/honey-forge-api,migrations/,deploy/"
          target: "/opt/honeyforge/incoming/${{ github.run_id }}-${{ github.run_attempt }}/"
          strip_components: 0
          overwrite: true

      - name: Install and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            set -e

            INCOMING="/opt/honeyforge/incoming/${{ github.run_id }}-${{ github.run_attempt }}"

            # Бэкап старого бинарника для отката
            cp /opt/honeyforge/src/backend/honey-forge-api \
               /opt/honeyforge/src/backend/honey-forge-api.prev 2>/dev/null || true

            # Обновить миграции (honeyforge владеет /opt/honeyforge — sudo не нужен)
            mkdir -p /opt/honeyforge/migrations
            cp -r "$INCOMING/migrations/." /opt/honeyforge/migrations/

            # Атомарно заменить бинарник
            install -m 0755 "$INCOMING/src/backend/honey-forge-api" \
              /opt/honeyforge/src/backend/honey-forge-api.new
            mv /opt/honeyforge/src/backend/honey-forge-api.new \
               /opt/honeyforge/src/backend/honey-forge-api

            # Перезапустить сервис
            sudo systemctl restart honeyforge

            # Ждать готовности /healthz
            for i in $(seq 1 15); do
              if curl --fail --silent \
                  --cacert /etc/nginx/certs/backend-ca.crt \
                  --resolve localhost:8443:127.0.0.1 \
                  https://localhost:8443/healthz | grep -q '"status":"ok"'; then
                echo "API is healthy"
                exit 0
              fi
              sleep 2
            done

            echo "API failed to become healthy — откат"
            cp /opt/honeyforge/src/backend/honey-forge-api.prev \
               /opt/honeyforge/src/backend/honey-forge-api 2>/dev/null || true
            sudo systemctl restart honeyforge
            sudo journalctl -u honeyforge -n 100 --no-pager
            exit 1

      - name: External smoke test
        env:
          API_DOMAIN: "honey-forge-seg-fault.ru"
          API_IP: ${{ secrets.SSH_HOST }}
        run: |
          set -e

          check() {
            local path="$1" expected="$2"
            local code
            code=$(curl -k -s -o /dev/null -w "%{http_code}" \
              --resolve "$API_DOMAIN:443:$API_IP" \
              "https://$API_DOMAIN$path")
            echo "$path → $code"
            [ "$code" = "$expected" ] || (echo "expected $expected, got $code"; exit 1)
          }

          check /api/session 401
          check /assets/stream 401
          check / 404

          echo "Smoke test passed"