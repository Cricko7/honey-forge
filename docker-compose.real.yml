# HoneyForge — РЕАЛЬНЫЙ стек на настоящих данных (nginx).
# Go API собирается в Docker (Go на хост не нужен). Единый origin
# https://localhost:8443: nginx отдаёт SPA и проксирует API/WSS на Go-бэкенд.
#
# Запуск без .env и ручной генерации: docker compose -f docker-compose.real.yml up --build -d
x-logging: &bounded-logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'

services:
  tls-init:
    logging: *bounded-logging
    image: alpine/openssl
    entrypoint: ["/bin/sh", "/tls/renew.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CURSOR_KEY: ${CURSOR_KEY:-}
      AGENT_TRAP_ID: ${AGENT_TRAP_ID:-}
    volumes:
      - tls_private:/certs
      - tls_postgres:/exports/postgres
      - tls_redis:/exports/redis
      - tls_kafka:/exports/kafka
      - tls_api:/exports/api
      - tls_web:/exports/web
      - tls_agent:/exports/agent
      - tls_orchestrator:/exports/orchestrator
      - ./deploy/tls:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /certs/bootstrap-ready"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: unless-stopped

  postgres:
    logging: *bounded-logging
    image: postgres:17
    entrypoint: ["/bin/sh", "/tls/postgres.sh"]
    environment:
      POSTGRES_USER: honey_forge
      POSTGRES_DB: honey_forge
      POSTGRES_PASSWORD_FILE: /certs/postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/tls/postgres.sh:/tls/postgres.sh:ro
      - tls_postgres:/certs:ro
    depends_on:
      tls-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honey_forge -d honey_forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    logging: *bounded-logging
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,TLS_HOST://:9092,TLS://:19092
      KAFKA_ADVERTISED_LISTENERS: TLS_HOST://127.0.0.1:29092,TLS://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,TLS:SSL,TLS_HOST:SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: TLS
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /certs/kafka.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /certs/ca.crt
      KAFKA_SSL_ENABLED_PROTOCOLS: TLSv1.2,TLSv1.3
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: '-Xms128m -Xmx256m'
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
      - tls_kafka:/certs:ro
    depends_on:
      tls-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 --command-config /certs/kafka-client.properties >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    logging: *bounded-logging
    image: redis:7.4.6
    entrypoint: ["/bin/sh", "/tls/redis.sh"]
    environment:
      REDIS_PASSWORD_FILE: /certs/redis-password
    volumes:
      - redis_data:/data
      - ./deploy/tls/redis.sh:/tls/redis.sh:ro
      - tls_redis:/certs:ro
    depends_on:
      tls-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /certs/redis-password)\" redis-cli --tls --cacert /certs/ca.crt ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      POSTGRES_PASSWORD_FILE: /certs/postgres-password
      CURSOR_KEY_FILE: /certs/cursor-key
      BROWSER_ORIGINS: https://localhost:8443
      API_PUBLIC_ORIGIN: https://localhost:8443
      KAFKA_BROKERS: kafka:19092
      KAFKA_CA_FILE: /certs/ca.crt
      AGENT_WS_URL: wss://resources.localhost:8443/assets/stream
      AUTO_DEPLOY_TRAPS: "true"
      HISTORY_RETENTION: ${HISTORY_RETENTION:-24h}
      API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE:-60}
      TLS_CERT_FILE: /certs/localhost.crt
      TLS_KEY_FILE: /certs/localhost.key
      AGENT_CLIENT_CA_FILE: /certs/agents-ca.crt
      API_ADDR: ":8443"
      GIN_MODE: release
    volumes:
      - tls_api:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  constructor:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: constructor/Dockerfile
    environment:
      HONEYFORGE_API_BASE: https://api:8443
      HONEYFORGE_CA_FILE: /certs/ca.crt
      HONEYFORGE_ORIGIN: https://localhost:8443
    volumes:
      - constructor_data:/data
      - tls_web:/certs:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  web:
    logging: *bounded-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
      args:
        VITE_API_BASE: https://localhost:8443
    ports:
      - "${MGMT_BIND_IP:-127.0.0.1}:8443:443"
    entrypoint: ["/bin/sh", "-c", "/bin/sh /tls/watch-nginx.sh; exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    volumes:
      - tls_web:/etc/nginx/certs:ro
      - ./deploy/tls/watch-nginx.sh:/tls/watch-nginx.sh:ro
    networks:
      default:
        aliases: [resources.localhost]
    depends_on:
      - api
      - constructor
    restart: unless-stopped

  # Необязательный ручной агент для ловушек, созданных без AUTO_DEPLOY_TRAPS.
  # Для автоматически управляемых ловушек используется orchestrator ниже.
  agent:
    logging: *bounded-logging
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      NM_WS_URL: wss://resources.localhost/assets/stream
      NM_INSTANCE_ID: ${AGENT_TRAP_ID:-}
      NM_TOKEN: ${AGENT_TOKEN:-}
      NM_STORE_URL_FILE: /certs/redis-url
      NM_CA_FILE: /certs/ca.crt
      NM_CERT_FILE: /certs/agent.crt
      NM_KEY_FILE: /certs/agent.key
      NM_SERVER_PINS_FILE: /certs/server-pins
      NM_WORKER_IMAGE: ${DECOY_TCP_IMAGE:-honeyforge/tcp-decoy:local}
      NM_WORKER_NETWORK: ${DECOY_NETWORK:-nm-mesh}
      NM_BIND_IP: ${DECOY_BIND_IP:-0.0.0.0}
    volumes:
      - tls_agent:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - web
      - redis
    restart: unless-stopped

  decoy-tcp-image:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: deploy/decoys/Dockerfile
      target: tcp
    image: ${DECOY_TCP_IMAGE:-honeyforge/tcp-decoy:local}
    entrypoint: ["/bin/true"]
    restart: "no"

  decoy-redis-image:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: deploy/decoys/Dockerfile
      target: redis
    image: ${DECOY_REDIS_IMAGE:-honeyforge/redis-decoy:local}
    entrypoint: ["/bin/true"]
    restart: "no"

  decoy-honeytoken-image:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: deploy/decoys/Dockerfile
      target: honeytokens
    image: ${DECOY_HONEYTOKEN_IMAGE:-honeyforge/honeytoken-decoy:local}
    entrypoint: ["/bin/true"]
    restart: "no"

  decoy-http-image:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: deploy/decoys/Dockerfile
      target: http
    image: ${DECOY_HTTP_IMAGE:-honeyforge/http-decoy:local}
    entrypoint: ["/bin/true"]
    restart: "no"

  orchestrator:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: deploy/decoys/Dockerfile.orchestrator
    environment:
      AGENT_PROXY_SERVICE: web
      AGENT_WS_HOST_IP: ${AGENT_WS_HOST_IP:-}
      AGENT_CLIENT_CA_FILE: /certs/agents-ca.crt
      AGENT_CLIENT_CA_KEY_FILE: /certs/agents-ca.key
      AGENT_SERVER_PINS_FILE: /certs/server-pins
      POSTGRES_PASSWORD_FILE: /certs/postgres-password
      AGENT_WS_URL: wss://resources.localhost/assets/stream
      AGENT_REDIS_URL_FILE: /certs/redis-url
      AGENT_CA_FILE: /certs/ca.crt
      DECOY_NETWORK: ${DECOY_NETWORK:-nm-mesh}
      MGMT_NETWORK: ${MGMT_NETWORK:-hf-mgmt}
      DECOY_BIND_IP: ${DECOY_BIND_IP:-0.0.0.0}
      DECOY_TCP_IMAGE: ${DECOY_TCP_IMAGE:-honeyforge/tcp-decoy:local}
      DECOY_REDIS_IMAGE: ${DECOY_REDIS_IMAGE:-honeyforge/redis-decoy:local}
      DECOY_HONEYTOKEN_IMAGE: ${DECOY_HONEYTOKEN_IMAGE:-honeyforge/honeytoken-decoy:local}
      DECOY_HTTP_IMAGE: ${DECOY_HTTP_IMAGE:-honeyforge/http-decoy:local}
      DECOY_SSH_IMAGE: ${DECOY_SSH_IMAGE:-honeyforge/ssh-decoy:local}
      SSH_SANDBOX_IMAGE: ${SSH_SANDBOX_IMAGE:-honeyforge/ssh-sandbox:local}
      TETRAGON_CONTAINER: ${TETRAGON_CONTAINER:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tls_orchestrator:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      web:
        condition: service_started
      redis:
        condition: service_healthy
      decoy-tcp-image:
        condition: service_completed_successfully
      decoy-redis-image:
        condition: service_completed_successfully
      decoy-honeytoken-image:
        condition: service_completed_successfully
      decoy-http-image:
        condition: service_completed_successfully
      decoy-ssh-image:
        condition: service_completed_successfully
      ssh-sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped

  decoy-ssh-image:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: deploy/decoys/Dockerfile
      target: ssh
    image: ${DECOY_SSH_IMAGE:-honeyforge/ssh-decoy:local}
    entrypoint: ["/bin/true"]
    restart: "no"

  ssh-sandbox-image:
    logging: *bounded-logging
    build:
      context: .
      dockerfile: deploy/decoys/Dockerfile.sandbox
    image: ${SSH_SANDBOX_IMAGE:-honeyforge/ssh-sandbox:local}
    entrypoint: ["/bin/true"]
    restart: "no"

volumes:
  constructor_data:
  tls_private:
  tls_postgres:
  tls_redis:
  tls_kafka:
  tls_api:
  tls_web:
  tls_agent:
  tls_orchestrator:
  postgres_data:
  kafka_data:
  redis_data:
