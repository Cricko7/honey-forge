# HoneyForge локальный реальный стек: nginx — единый origin https://localhost:8443.
# Отдаёт SPA и проксирует API/WSS на Go-бэкенд (он слушает только HTTPS).
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256k;

    # Проверяем сертификат API и его имя даже в локальном Docker-стеке.
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_name api;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;

    # Frontend dashboard WSS — нужен upgrade (иначе /api/ очистит Connection).
    location = /api/stream {
        proxy_pass https://api:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 40s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # Telemetry is available only on the separate resource host below.
    location = /assets/stream {
        return 404;
    }

    location /api/ {
        proxy_pass https://api:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # SPA + клиентский роутинг
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name resources.localhost;
    server_tokens off;
    ssl_certificate /etc/nginx/certs/resources.crt;
    ssl_certificate_key /etc/nginx/certs/resources.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/certs/agents-ca.crt;
    ssl_verify_client optional;
    ssl_session_tickets off;
    client_max_body_size 256k;

    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_name api;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;

    proxy_ssl_certificate /etc/nginx/certs/resource-proxy.crt;
    proxy_ssl_certificate_key /etc/nginx/certs/resource-proxy.key;

    location / {
        proxy_pass https://api:8443;
        proxy_set_header X-Agent-Certificate $ssl_client_escaped_cert;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 40s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }
}
