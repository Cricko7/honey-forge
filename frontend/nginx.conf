# HoneyForge локальный реальный стек: nginx — единый origin https://localhost:8443.
# Отдаёт SPA и проксирует API/WSS на Go-бэкенд (он слушает только HTTPS).
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256k;

    # Go API сам работает по HTTPS с self-signed сертом; для локалки проверку
    # upstream TLS отключаем. На проде — proxy_ssl_verify on + backend-ca.crt.
    proxy_ssl_server_name on;
    proxy_ssl_verify off;

    # Frontend dashboard WSS — нужен upgrade (иначе /api/ очистит Connection).
    location = /api/stream {
        proxy_pass https://api:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 40s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # Agent WSS (на случай подключения агента к этому же origin).
    location = /assets/stream {
        proxy_pass https://api:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 40s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass https://api:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # SPA + клиентский роутинг
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
