services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: honey_forge
      POSTGRES_DB: honey_forge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honey_forge -d honey_forge"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
