openapi: 3.1.0
info:
  title: HoneyForge Constructor
  version: 1.0.0
  description: Constructor uses the current HoneyForge browser session. Administrator,
    matching Origin and X-CSRF-Token are required for all mutations. Boards are organization
    scoped. Deploy compiles custom/listener, custom/banner and custom/rule blocks
    into one custom-tcp/1 profile and managed trap, and http/* behavior blocks into
    one custom-http/2 profile and managed Python trap per board. Multiple HTTP inputs
    expose separate ports within that trap. Calls between inputs on the same board
    pass JSON and return results without outgoing network access. Conditions, switches,
    transforms, session state, fork/join, delay, responses and error branches are supported.
    http/send forwards typed JSON to separately deployed custom-http traps in the same
    organization through authenticated agent channels. Target trap, service, POST/PUT/PATCH
    method and endpoint are explicit; deployment validates the destination and creates
    a directed trap-link permission. http/event emits http.custom at a selected stage
    with a configured name, severity and JSON payload, preserving technical telemetry.
    Existing trap-links also retain passive raw-traffic mirroring. Pipeline delivery is
    asynchronous and in memory; acceptance means queued, not completed, with no replay
    across agent/server restarts. Pipelines share a 4096-handoff budget and 30-second
    lifetime, 8 KiB payloads and bounded queues. HTTP flow execution defaults to 512 steps, 10 seconds and 64 KiB bodies;
    call depth is bounded at 32. See api/13-custom-http.md. TCP rules compare LF/CRLF-terminated
    lines and the first matching rule responds. Deleting a board does not delete deployed
    traps. Runtime and SSE contain real telemetry only. JSON bodies reject duplicate
    keys and non-JSON numeric constants with 400. Unpaired Unicode surrogates,
    non-finite numbers (including numeric overflow) and malformed trap bindings
    are rejected with 422 before any board mutation. A storage failure returns 503
    without publishing the failed board mutation.
