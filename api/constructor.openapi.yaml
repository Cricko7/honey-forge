components:
  responses:
    InvalidJSON:
      description: Malformed JSON, duplicate keys or non-JSON numeric constants. No board mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConstructorError'
    TooLarge:
      description: Request body exceeds 256 KiB.
  schemas:
    ChainCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          default: Новая цепочка
        description:
          type: string
          title: Description
          default: ''
        tags:
          items:
            type: string
          type: array
          title: Tags
        template:
          anyOf:
          - type: string
          - type: 'null'
          title: Template
      additionalProperties: false
      type: object
      title: ChainCreate
    ChainUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
        nodes:
          anyOf:
          - items:
              $ref: '#/components/schemas/Node'
            type: array
            maxItems: 512
          - type: 'null'
          title: Nodes
        edges:
          anyOf:
          - items:
              $ref: '#/components/schemas/Edge'
            type: array
            maxItems: 1024
          - type: 'null'
          title: Edges
        viewport:
          anyOf:
          - $ref: '#/components/schemas/Viewport'
          - type: 'null'
      additionalProperties: false
      type: object
      title: ChainUpdate
    DeployRequest:
      properties:
        action:
          type: string
          enum:
          - deploy
          - stop
          title: Action
          default: deploy
      additionalProperties: false
      type: object
      title: DeployRequest
    Edge:
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          title: Id
        source:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          title: Source
        source_port:
          type: string
          title: Source Port
        target:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          title: Target
        target_port:
          type: string
          title: Target Port
        label:
          type: string
          title: Label
          default: ''
      type: object
      required:
      - source
      - source_port
      - target
      - target_port
      title: Edge
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Node:
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          title: Id
        type:
          type: string
          title: Type
        position:
          $ref: '#/components/schemas/Position'
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        config:
          additionalProperties: true
          type: object
          title: Config
        notes:
          type: string
          title: Notes
          default: ''
      type: object
      required:
      - type
      title: Node
    Position:
      properties:
        x:
          type: number
          title: X
          default: 0
        y:
          type: number
          title: Y
          default: 0
      type: object
      title: Position
    RealCommand:
      properties:
        action:
          type: string
          enum:
          - start
          - stop
          title: Action
      additionalProperties: false
      type: object
      required:
      - action
      title: RealCommand
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Viewport:
      properties:
        x:
          type: number
          title: X
          default: 0
        y:
          type: number
          title: Y
          default: 0
        zoom:
          type: number
          title: Zoom
          default: 1.0
      type: object
      title: Viewport
    ConstructorError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    RealTrapCreate:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        name:
          type: string
          title: Name
        profile_id:
          type: string
          format: uuid
          title: Profile Id
        description:
          type: string
          title: Description
          default: ''
      additionalProperties: false
      type: object
      required:
      - request_id
      - name
      - profile_id
      title: RealTrapCreate
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
security:
- sessionCookie: []
