components:
  headers:
    CacheControl:
      description: no-store; catalog uses private, max-age=0, must-revalidate with ETag.
      schema:
        type: string
    Cookie:
      description: __Host-session=<opaque>; Path=/; Secure; HttpOnly; SameSite=Strict; Max-Age=604800. Logout uses Max-Age=0.
      schema:
        type: string
    RequestID:
      description: Server-generated identifier, also included in REST errors.
      schema:
        $ref: "#/components/schemas/ID"
    RetryAfter:
      description: Retry delay in seconds for 429 and retryable 503.
      schema:
        minimum: 1
        type: integer
  parameters:
    CSRF:
      description: CSRF token from SessionView for the active session.
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
    Cursor:
      in: query
      name: cursor
      schema:
        $ref: "#/components/schemas/Cursor"
    ExpectedRevision:
      in: header
      name: X-Expected-Revision
      required: true
      schema:
        $ref: "#/components/schemas/Revision"
    IfMatch:
      description: Exact strong profile ETag. Wildcards and repeated values are rejected.
      in: header
      name: If-Match
      required: true
      schema:
        type: string
    Limit:
      in: query
      name: limit
      schema:
        default: 50
        maximum: 100
        minimum: 1
        type: integer
    LogoutCSRF:
      description: Required when the session is active; logout without an active session is 204.
      in: header
      name: X-CSRF-Token
      required: false
      schema:
        type: string
    Origin:
      description: Exactly ALLOWED_ORIGIN, including scheme and port. Missing, null, duplicated or different values fail.
      in: header
      name: Origin
      required: true
      schema:
        type: string
    ProfileID:
      in: path
      name: id
      required: true
      schema:
        format: uuid
        type: string
    TrapID:
      in: path
      name: id
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    CommandID:
      in: path
      name: command_id
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    TypeID:
      in: query
      name: type_id
      schema:
        pattern: ^[a-z][a-z0-9_.-]{0,63}$
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 400 invalid_json, invalid_query, invalid_id, invalid_cursor or invalid_precondition.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Catalog200:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CatalogPage"
      description: Catalog snapshot page
      headers:
        Cache-Control:
          schema:
            const: private, max-age=0, must-revalidate
            type: string
        ETag:
          schema:
            type: string
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Catalog200Detail:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CatalogEntry"
      description: Exact catalog entry; contains no profile configuration or credentials.
      headers:
        Cache-Control:
          schema:
            const: private, max-age=0, must-revalidate
            type: string
        ETag:
          schema:
            type: string
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Catalog304:
      description: The first-page catalog ETag matches; no response body.
      headers:
        Cache-Control:
          schema:
            const: private, max-age=0, must-revalidate
            type: string
        ETag:
          schema:
            type: string
    Catalog304Detail:
      description: ETag matches; no response body.
      headers:
        Cache-Control:
          schema:
            const: private, max-age=0, must-revalidate
            type: string
        ETag:
          schema:
            type: string
    Catalog404Detail:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Unknown pair, resource_not_found.
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 409 email_in_use, already_authenticated, join_code_changed, revision_exhausted, idempotency_conflict, request_already_used, trap_type_unavailable or profile_in_use.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Error:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Shared error. Fixed codes and messages are listed in 01-common.md.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 403 forbidden, origin_not_allowed or csrf_failed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Health:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
      description: API process is alive.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 500 internal_error; sensitive details are excluded.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    JoinCode:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JoinCode"
      description: Current join code, visible only to admin.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    LoggedOut:
      description: Current session revoked, cookie cleared; also succeeds without an active session.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Set-Cookie:
          $ref: "#/components/headers/Cookie"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 405 method_not_allowed.
      headers:
        Allow:
          schema:
            type: string
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 404 resource_not_found.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Organization:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Organization"
      description: Own organization without the join code.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    PreconditionFailed:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 412 revision_mismatch.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    PreconditionRequired:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 428 precondition_required.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Profile:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Profile"
      description: Own profile with current ETag.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        ETag:
          schema:
            type: string
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    ProfileCreated:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Profile"
      description: Created profile, revision 1.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        ETag:
          schema:
            type: string
        Location:
          schema:
            type: string
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    ProfileDeleted:
      description: Profile deleted. Immutable revisions and request IDs retained.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    ProfilePage:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfilePage"
      description: Profiles ordered by created_at DESC, id DESC; empty list has items [] and next_cursor null.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    ProfileReplayed:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Profile"
      description: Original created revision; ETag is omitted when that revision is no longer current. Deleted keys return 409.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        ETag:
          schema:
            type: string
        Idempotency-Replayed:
          schema:
            const: "true"
            type: string
        Location:
          schema:
            type: string
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    RateLimited:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 429 rate_limited; 10 attempts in 60 seconds per client IP, shared by login and registration.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Session:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionView"
      description: Active session with current role and CSRF token.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    SessionCreated:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SessionView"
      description: Session created. Cookie and secrets are never returned in JSON.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Location:
          schema:
            const: /api/session
            type: string
        Set-Cookie:
          $ref: "#/components/headers/Cookie"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    TooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 413 body_too_large; maximum request body is 256 KiB.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 401 unauthenticated or invalid_credentials.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    Unavailable:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 503 database_unavailable or service_unavailable; request may be retried after the stated delay.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 415 unsupported_media_type; application/json is required.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
    ValidationFailed:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: 422 validation_failed, invalid_join_code, unknown_trap_type, config_invalid or config_too_large; fields contain safe JSON Pointer paths.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
  schemas:
    Command:
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ID"
        trap_id:
          $ref: "#/components/schemas/ID"
        request_id:
          $ref: "#/components/schemas/ID"
        action:
          enum: [apply_config, start, stop]
          type: string
        params:
          type: object
        status:
          enum: [queued, running, succeeded, failed, expired]
          type: string
        target_profile_revision:
          oneOf:
          - $ref: "#/components/schemas/Revision"
          - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        result:
          type: [object, "null"]
        error:
          oneOf:
          - $ref: "#/components/schemas/RuntimeError"
          - type: "null"
      required: [id, trap_id, request_id, action, params, status, target_profile_revision, created_at, expires_at, started_at, finished_at, result, error]
      type: object
    CommandPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Command"
          type: array
        next_cursor:
          type: [string, "null"]
          maxLength: 2048
      required: [items, next_cursor]
      type: object
    CreateCommandRequest:
      additionalProperties: false
      properties:
        request_id:
          $ref: "#/components/schemas/ID"
        action:
          enum: [apply_config, start, stop]
          type: string
        params:
          description: Validated against the action descriptor of the trap's exact type version.
          type: object
      required: [request_id, action, params]
      type: object
    RuntimeError:
      additionalProperties: false
      properties:
        code:
          maxLength: 64
          minLength: 1
          type: string
        message:
          maxLength: 200
          minLength: 1
          type: string
      required: [code, message]
      type: object
    Action:
      $ref: "#/components/schemas/TypeID"
    ActionDescriptor:
      additionalProperties: false
      properties:
        action:
          $ref: "#/components/schemas/Action"
        params_schema:
          $ref: "#/components/schemas/JSONSchema"
        result_schema:
          $ref: "#/components/schemas/JSONSchema"
        title:
          maxLength: 100
          minLength: 1
          type: string
      required:
      - action
      - title
      - params_schema
      - result_schema
      type: object
    Bytes:
      contentEncoding: base64
      description: Standard alphabet with canonical padding; feature limits apply to decoded bytes.
      type: string
    CatalogEntry:
      additionalProperties: false
      properties:
        actions:
          description: Unique action identifiers; start, stop and apply_config are mandatory. Additional actions need no new route.
          items:
            $ref: "#/components/schemas/ActionDescriptor"
          minItems: 3
          type: array
        available_for_new_profiles:
          type: boolean
        config_schema:
          $ref: "#/components/schemas/JSONSchema"
        description:
          $ref: "#/components/schemas/Description"
        event_schemas:
          description: Unique event_type identifiers; only declared events are accepted for this exact type/version.
          items:
            $ref: "#/components/schemas/EventDescriptor"
          type: array
        interaction_level:
          description: Open string, currently low; not a closed enum.
          maxLength: 32
          minLength: 1
          type: string
        title:
          maxLength: 100
          minLength: 1
          type: string
        type_id:
          $ref: "#/components/schemas/TypeID"
        type_version:
          $ref: "#/components/schemas/TypeVersion"
        ui:
          $ref: "#/components/schemas/UIHints"
      required:
      - type_id
      - type_version
      - title
      - description
      - interaction_level
      - available_for_new_profiles
      - config_schema
      - event_schemas
      - actions
      - ui
      type: object
    CatalogPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/CatalogEntry"
          type: array
        next_cursor:
          oneOf:
          - $ref: "#/components/schemas/Cursor"
          - type: "null"
      required:
      - items
      - next_cursor
      type: object
    ClearSecretFields:
      description: Only writeOnly paths in the current schema. Assignment and clearing of the same path fails with 422 validation_failed.
      items:
        format: json-pointer
        type: string
      type: array
    CreateOrganizationInput:
      additionalProperties: false
      properties:
        mode:
          const: create
          type: string
        name:
          description: 1..100 Unicode characters after trimming outer whitespace; names are not unique.
          type: string
      required:
      - mode
      - name
      type: object
    CreateProfileRequest:
      additionalProperties: false
      properties:
        config:
          description: Full config validated by the exact immutable catalog version; maximum 128 KiB of UTF-8 JSON.
          type: object
        description:
          default: ""
          maxLength: 1000
          type: string
        name:
          description: Trimmed before storage and idempotency comparison.
          maxLength: 100
          minLength: 1
          type: string
        request_id:
          format: uuid
          type: string
        type_id:
          pattern: ^[a-z][a-z0-9_.-]{0,63}$
          type: string
        type_version:
          $ref: "#/components/schemas/Revision"
      required:
      - request_id
      - name
      - type_id
      - type_version
      - config
      type: object
    Cursor:
      description: Opaque; bound to organization, collection, normalized filters and first-page boundary.
      maxLength: 2048
      type: string
    Description:
      maxLength: 1000
      type: string
    Email:
      description: Valid ASCII email without display name, at most 254 characters after trimming. Compared and returned lowercase.
      type: string
    Envelope:
      additionalProperties: false
      properties:
        message_id:
          $ref: "#/components/schemas/ID"
        payload:
          type: object
        reply_to:
          oneOf:
          - $ref: "#/components/schemas/ID"
          - type: "null"
        type:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - message_id
      - type
      - payload
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          type: string
        fields:
          items:
            $ref: "#/components/schemas/FieldError"
          maxItems: 20
          type: array
        message:
          type: string
      required:
      - code
      - message
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/Error"
        request_id:
          $ref: "#/components/schemas/ID"
      required:
      - error
      - request_id
      type: object
    EventDescriptor:
      additionalProperties: false
      properties:
        data_schema:
          $ref: "#/components/schemas/JSONSchema"
        event_type:
          $ref: "#/components/schemas/EventType"
        title:
          maxLength: 100
          minLength: 1
          type: string
      required:
      - event_type
      - title
      - data_schema
      type: object
    EventType:
      $ref: "#/components/schemas/TypeID"
    FieldError:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        path:
          description: JSON Pointer; query paths start with /query/.
          type: string
      required:
      - path
      - code
      - message
      type: object
    Health:
      properties:
        status:
          const: ok
          type: string
      required:
      - status
      type: object
    ID:
      format: uuid
      type: string
    JSONSchema:
      additionalProperties: true
      description: Self-contained Draft 2020-12, local $ref/$defs only. Supports recursive objects/arrays, scalars, enum, oneOf, constraints and annotations. Used UUID/IP/date-time/email formats are asserted by the server. Defaults are hints and never fill missing request fields.
      properties:
        $schema:
          const: https://json-schema.org/draft/2020-12/schema
          type: string
      required:
      - $schema
      type: object
    JoinCode:
      properties:
        code:
          pattern: ^[A-Za-z0-9_-]{32}$
          type: string
        revision:
          maximum: 2147483647
          minimum: 1
          type: integer
        rotated_at:
          format: date-time
          type: string
      required:
      - code
      - revision
      - rotated_at
      type: object
    JoinOrganizationInput:
      additionalProperties: false
      properties:
        join_code:
          pattern: ^[A-Za-z0-9_-]{32}$
          type: string
        mode:
          const: join
          type: string
      required:
      - mode
      - join_code
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          $ref: "#/components/schemas/Password"
      required:
      - email
      - password
      type: object
    Name:
      description: Bounds apply after trimming surrounding whitespace.
      maxLength: 100
      minLength: 1
      type: string
    Organization:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
      required:
      - id
      - name
      - created_at
      type: object
    Page:
      additionalProperties: false
      properties:
        items:
          items: {}
          type: array
        next_cursor:
          oneOf:
          - $ref: "#/components/schemas/Cursor"
          - type: "null"
      required:
      - items
      - next_cursor
      type: object
    Password:
      description: 12..128 Unicode characters, at most 512 UTF-8 bytes; no trimming or normalization.
      maxLength: 128
      minLength: 12
      type: string
      writeOnly: true
      x-maxBytes: 512
    PatchProfileRequest:
      additionalProperties: false
      description: Replaces all nonsecret config fields; omitted writeOnly values are retained. The same path cannot be cleared and supplied. No commands or trap state changes. Unchanged values keep revision and ETag.
      minProperties: 1
      properties:
        clear_secret_fields:
          items:
            description: JSON Pointer to a writeOnly field of the current type.
            type: string
          maxItems: 100
          type: array
          uniqueItems: true
        config:
          type: object
        description:
          maxLength: 1000
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
      type: object
    Profile:
      properties:
        config:
          description: Editable nonsecret config; installed writeOnly values are absent.
          type: object
        created_at:
          format: date-time
          type: string
        description:
          maxLength: 1000
          type: string
        id:
          format: uuid
          type: string
        interaction_level:
          maxLength: 32
          minLength: 1
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        revision:
          $ref: "#/components/schemas/Revision"
        secret_fields_set:
          items:
            description: JSON Pointer of an installed writeOnly field.
            type: string
          type: array
          uniqueItems: true
        type_id:
          pattern: ^[a-z][a-z0-9_.-]{0,63}$
          type: string
        type_version:
          $ref: "#/components/schemas/Revision"
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - name
      - description
      - type_id
      - type_version
      - interaction_level
      - config
      - secret_fields_set
      - revision
      - created_at
      - updated_at
      type: object
    ProfilePage:
      properties:
        items:
          items:
            $ref: "#/components/schemas/Profile"
          type: array
        next_cursor:
          maxLength: 2048
          type:
          - string
          - "null"
      required:
      - items
      - next_cursor
      type: object
    RegisterRequest:
      additionalProperties: false
      properties:
        email:
          $ref: "#/components/schemas/Email"
        organization:
          discriminator:
            propertyName: mode
          oneOf:
          - $ref: "#/components/schemas/CreateOrganizationInput"
          - $ref: "#/components/schemas/JoinOrganizationInput"
        password:
          $ref: "#/components/schemas/Password"
      required:
      - email
      - password
      - organization
      type: object
    Revision:
      maximum: 2147483647
      minimum: 1
      type: integer
    RotateJoinCodeRequest:
      additionalProperties: false
      properties:
        expected_revision:
          maximum: 2147483647
          minimum: 1
          type: integer
      required:
      - expected_revision
      type: object
    SecretFieldsSet:
      description: Installed writeOnly paths; secret values are omitted from the public config.
      items:
        format: json-pointer
        type: string
      type: array
    SessionView:
      properties:
        csrf_token:
          type: string
        expires_at:
          format: date-time
          type: string
        organization:
          $ref: "#/components/schemas/Organization"
        user:
          $ref: "#/components/schemas/User"
      required:
      - user
      - organization
      - expires_at
      - csrf_token
      type: object
    Timestamp:
      description: RFC 3339 with timezone; responses use UTC Z.
      format: date-time
      type: string
    TypeID:
      pattern: ^[a-z][a-z0-9_.-]{0,63}$
      type: string
    TypeVersion:
      $ref: "#/components/schemas/Revision"
    UIHints:
      additionalProperties: false
      description: Optional hints for clients. Ignore an unknown widget and use a generic JSON editor. No executable UI code or form-loading URLs.
      properties:
        field_order:
          items:
            format: json-pointer
            type: string
          type: array
        widgets:
          additionalProperties:
            enum:
            - text
            - textarea
            - number
            - checkbox
            - select
            - password
            - array
            - object
            type: string
          propertyNames:
            format: json-pointer
            type: string
          type: object
      required:
      - field_order
      - widgets
      type: object
    User:
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        organization_id:
          format: uuid
          type: string
        role:
          enum:
          - admin
          - viewer
          type: string
      required:
      - id
      - organization_id
      - email
      - role
      - created_at
      type: object
    CreateTrapRequest:
      type: object
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/ID'
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
          default: ''
        profile_id:
          $ref: '#/components/schemas/ID'
      required:
      - request_id
      - name
      - profile_id
    PatchTrapRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
      required: []
      minProperties: 1
    AgentStatus:
      type: object
      additionalProperties: false
      properties:
        agent_version:
          type: string
          minLength: 1
          maxLength: 64
        hostname:
          type: string
          minLength: 1
          maxLength: 255
        buffered_events:
          type: integer
          minimum: 0
        buffer_bytes:
          type: integer
          minimum: 0
        buffer_capacity_bytes:
          type: integer
          minimum: 1
        buffer_state:
          type: string
          enum:
          - ok
          - full
          - unavailable
        last_error:
          anyOf:
          - $ref: '#/components/schemas/RuntimeError'
          - type: 'null'
      required:
      - agent_version
      - hostname
      - buffered_events
      - buffer_bytes
      - buffer_capacity_bytes
      - buffer_state
      - last_error
    Trap:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
        profile_id:
          $ref: '#/components/schemas/ID'
        type_id:
          $ref: '#/components/schemas/TypeID'
        type_version:
          $ref: '#/components/schemas/TypeVersion'
        interaction_level:
          type: string
        revision:
          $ref: '#/components/schemas/Revision'
        state_version:
          $ref: '#/components/schemas/Revision'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        connectivity:
          type: string
          enum:
          - online
          - offline
        last_seen_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        runtime_state:
          type: string
          enum:
          - unknown
          - running
          - stopped
          - error
        desired_state:
          type: string
          enum:
          - running
          - stopped
        desired_profile_revision:
          anyOf:
          - $ref: '#/components/schemas/Revision'
          - type: 'null'
        applied_profile_revision:
          anyOf:
          - $ref: '#/components/schemas/Revision'
          - type: 'null'
        agent:
          anyOf:
          - $ref: '#/components/schemas/AgentStatus'
          - type: 'null'
        active_command_id:
          anyOf:
          - $ref: '#/components/schemas/ID'
          - type: 'null'
      required:
      - id
      - name
      - description
      - profile_id
      - type_id
      - type_version
      - interaction_level
      - revision
      - state_version
      - created_at
      - updated_at
      - connectivity
      - last_seen_at
      - runtime_state
      - desired_state
      - desired_profile_revision
      - applied_profile_revision
      - agent
      - active_command_id
    TrapPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trap'
        next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
      required:
      - items
      - next_cursor
    AgentCredentialsRequest:
      type: object
      additionalProperties: false
      properties:
        expected_generation:
          type: integer
          minimum: 0
          maximum: 2147483646
      required:
      - expected_generation
    AgentCredentials:
      type: object
      additionalProperties: false
      properties:
        trap_id:
          $ref: '#/components/schemas/ID'
        token:
          type: string
          description: Opaque secret, returned once; valid until rotation/revocation/deletion.
        generation:
          $ref: '#/components/schemas/Revision'
        agent_ws_url:
          type: string
          format: uri
          pattern: ^wss://
        issued_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - trap_id
      - token
      - generation
      - agent_ws_url
      - issued_at
    AgentCredentialsStatus:
      type: object
      additionalProperties: false
      properties:
        trap_id:
          $ref: '#/components/schemas/ID'
        generation:
          type: integer
          minimum: 0
          maximum: 2147483647
        active:
          type: boolean
        issued_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - trap_id
      - generation
      - active
      - issued_at
    EventSummary:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/ID'
        event_type:
          $ref: '#/components/schemas/TypeID'
        type_id:
          $ref: '#/components/schemas/TypeID'
        type_version:
          $ref: '#/components/schemas/TypeVersion'
        profile_revision:
          $ref: '#/components/schemas/Revision'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        session_id:
          $ref: '#/components/schemas/ID'
        session_sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        source:
          type: object
          additionalProperties: false
          properties:
            ip:
              type: string
              description: Canonical IPv4/IPv6 literal; no hostname or zone.
            port:
              type: integer
              minimum: 1
              maximum: 65535
          required:
          - ip
          - port
        destination:
          type: object
          additionalProperties: false
          properties:
            protocol:
              type: string
              minLength: 1
              maxLength: 32
            port:
              type: integer
              minimum: 1
              maximum: 65535
          required:
          - protocol
          - port
        trap_id:
          $ref: '#/components/schemas/ID'
        received_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - event_id
      - event_type
      - type_id
      - type_version
      - profile_revision
      - occurred_at
      - session_id
      - session_sequence
      - source
      - destination
      - trap_id
      - received_at
    Event:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/ID'
        event_type:
          $ref: '#/components/schemas/TypeID'
        type_id:
          $ref: '#/components/schemas/TypeID'
        type_version:
          $ref: '#/components/schemas/TypeVersion'
        profile_revision:
          $ref: '#/components/schemas/Revision'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        session_id:
          $ref: '#/components/schemas/ID'
        session_sequence:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        source:
          type: object
          additionalProperties: false
          properties:
            ip:
              type: string
              description: Canonical IPv4/IPv6 literal; no hostname or zone.
            port:
              type: integer
              minimum: 1
              maximum: 65535
          required:
          - ip
          - port
        destination:
          type: object
          additionalProperties: false
          properties:
            protocol:
              type: string
              minLength: 1
              maxLength: 32
            port:
              type: integer
              minimum: 1
              maximum: 65535
          required:
          - protocol
          - port
        trap_id:
          $ref: '#/components/schemas/ID'
        received_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          description: Original captured values; exact type catalog validates data.
        source_enrichment:
          type: object
          additionalProperties: false
          properties:
            country_code:
              anyOf:
              - type: string
              - type: 'null'
            asn:
              anyOf:
              - type: integer
                minimum: 1
                maximum: 4294967295
              - type: 'null'
          required:
          - country_code
          - asn
      required:
      - event_id
      - event_type
      - type_id
      - type_version
      - profile_revision
      - occurred_at
      - session_id
      - session_sequence
      - source
      - destination
      - trap_id
      - received_at
      - data
      - source_enrichment
    EventPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
        stream_cursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - items
      - next_cursor
      - stream_cursor
  securitySchemes:
    OperatorSession:
      description: Module 02 must resolve the active server session; client roles/organization IDs are never trusted.
      in: cookie
      name: __Host-session
      type: apiKey
    sessionCookie:
      description: Opaque server-side session. Secure, HttpOnly, SameSite=Strict; no Domain.
      in: cookie
      name: __Host-session
      type: apiKey
info:
  description: Integrated operator authentication, catalog, profiles, traps, agent credentials, commands, agent WSS and durable event history. Authenticated mutations require Origin and X-CSRF-Token.
  title: HoneyForge API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/traps:
    get:
      operationId: listTraps
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: profile_id
        in: query
        schema:
          $ref: '#/components/schemas/ID'
      - name: connectivity
        in: query
        schema:
          type: string
          enum:
          - online
          - offline
      responses:
        '200':
          description: Live registrations ordered by created_at DESC/id DESC. Cursor retains the first-page creation boundary and is scoped to organization and filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrapPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createTrap
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
      responses:
        '201':
          description: Registers an offline/unknown/stopped trap at revision=state_version=1; no token or implicit configuration/start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trap'
          headers:
            Location:
              schema:
                type: string
              description: /api/traps/{id}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: 'Conflict: idempotency_conflict, request_already_used, revision_exhausted, trap_type_unavailable, agent_credentials_changed, command_in_progress, trap_offline, trap_not_stopped or trap_buffer_not_empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Initial creation DTO on replay; GET returns current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trap'
          headers:
            Idempotency-Replayed:
              schema:
                const: 'true'
                type: string
            Location:
              schema:
                type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrapRequest'
  /api/traps/{id}:
    parameters:
    - $ref: '#/components/parameters/TrapID'
    get:
      operationId: readTrap
      security:
      - sessionCookie: []
      parameters: []
      responses:
        '200':
          description: Current trap. No ETag; state_version orders full DTO changes. last_seen_at is accepted hello/heartbeat server time. Offline does not imply stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: patchTrap
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '200':
          description: Only name/description. No-op preserves revision/updated_at; heartbeat and commands do not conflict with editable revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: 'Conflict: idempotency_conflict, request_already_used, revision_exhausted, trap_type_unavailable, agent_credentials_changed, command_in_progress, trap_offline, trap_not_stopped or trap_buffer_not_empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTrapRequest'
    delete:
      operationId: deleteTrap
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '204':
          description: Tombstones registration and revokes token/WSS. Requires no active command/ingestion, current online hello, stopped desired/runtime and empty healthy buffer. Never-issued registrations can be deleted offline. History remains readable; repeated DELETE is 404.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: 'Conflict: idempotency_conflict, request_already_used, revision_exhausted, trap_type_unavailable, agent_credentials_changed, command_in_progress, trap_offline, trap_not_stopped or trap_buffer_not_empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/traps/{id}/agent-credentials:
    parameters:
    - $ref: '#/components/parameters/TrapID'
    get:
      operationId: readAgentCredentials
      security:
      - sessionCookie: []
      parameters: []
      responses:
        '200':
          description: Admin only. Generation 0/active false/issued_at null before first issue. Token is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCredentialsStatus'
          headers:
            ETag:
              schema:
                type: string
              description: 'Strong ETag: "agent-credentials:<trap_id>:<generation>".'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: issueAgentCredentials
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Admin only. Atomically compares expected_generation, issues one secret and immediately revokes previous token/WSS (4401). Lost-response retry is 409 agent_credentials_changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCredentials'
          headers:
            ETag:
              schema:
                type: string
              description: 'Strong ETag: "agent-credentials:<trap_id>:<generation>".'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: 'Conflict: idempotency_conflict, request_already_used, revision_exhausted, trap_type_unavailable, agent_credentials_changed, command_in_progress, trap_offline, trap_not_stopped or trap_buffer_not_empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCredentialsRequest'
    delete:
      operationId: revokeAgentCredentials
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/CSRF'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"agent-credentials:[0-9a-f-]+:[0-9]+"$
      responses:
        '204':
          description: Admin only. Exact current ETag; increments generation on actual revocation, current inactive generation is a no-op. Closes WSS 4401; does not stop the service.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: 'Conflict: idempotency_conflict, request_already_used, revision_exhausted, trap_type_unavailable, agent_credentials_changed, command_in_progress, trap_offline, trap_not_stopped or trap_buffer_not_empty.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
  /api/events:
    get:
      operationId: listEvents
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - in: query
        name: trap_id
        schema:
          $ref: '#/components/schemas/ID'
      - in: query
        name: from
        schema:
          $ref: '#/components/schemas/Timestamp'
      - in: query
        name: to
        schema:
          $ref: '#/components/schemas/Timestamp'
      - in: query
        name: source_ip
        schema:
          type: string
      - in: query
        name: event_type
        schema:
          $ref: '#/components/schemas/TypeID'
      - in: query
        name: session_id
        schema:
          $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Own summaries including tombstone traps. All filters AND; order occurred_at DESC/event_id DESC. Late events stay outside original page boundary. stream_cursor is retained across pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/events/{event_id}:
    get:
      operationId: readEvent
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: event_id
        required: true
        schema:
          $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Immutable own details including original captured data and tombstone history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
