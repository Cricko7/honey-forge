# HoneyForge — локальная связка через Caddy в Docker.
# Единый origin http://localhost:8088: Caddy отдаёт SPA и проксирует API+WSS
# на стаб-бэкенд. CORS не нужен (один origin). Go/Postgres/Kafka не требуются.
#
# Запуск:  docker compose up --build
# Открыть: http://localhost:8088
services:
  stub:
    build: ./backend-stub
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      BROWSER_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
    expose:
      - "8080"
    restart: unless-stopped

  caddy:
    build:
      context: ./frontend
      args:
        # Единый origin: фронт зовёт API по тому же адресу, что и сам обслуживается.
        VITE_API_BASE: http://localhost:8088
    ports:
      - "8088:80"
    depends_on:
      - stub
    restart: unless-stopped
