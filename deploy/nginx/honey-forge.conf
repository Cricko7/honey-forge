# Install as an http-context conf.d file. Replace certificates and host name.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    server_name honeyforge.example;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/public.crt;
    ssl_certificate_key /etc/nginx/certs/public.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    error_page 413 = @body_too_large;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The API keeps its own TLS certificate. Verify it, even on loopback.
    proxy_ssl_trusted_certificate /etc/nginx/certs/backend-ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_name localhost;
    proxy_ssl_server_name on;

    location = /assets/stream {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 40s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # Frontend dashboard WSS. Must receive the WebSocket upgrade; the generic
    # /api/ block below clears Connection and would break the handshake.
    location = /api/stream {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 40s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }

    location @body_too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Request-ID $request_id always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 413 '{"error":{"code":"body_too_large","message":"Request body is too large"}}';
    }
}
